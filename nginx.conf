# nginx de la imagen de la UI: sirve los archivos compilados (dist/).
# No es el reverse proxy del stack: ese vive en SnippetSearcher-infra y le
# pasa a este contenedor todo lo que no empieza con /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Las rutas como /snippet/<id> las maneja React, no son archivos. Si el
    # archivo no existe, se responde index.html y React muestra la pantalla.
    # Sin esto, recargar la página en esas rutas da 404.
    location / {
        try_files $uri /index.html;
    }

    # Los JS y CSS compilados sí son archivos: si no existe, 404. Si no, el
    # navegador recibiría index.html en lugar del JS que pidió.
    location /assets/ {
        try_files $uri =404;
    }
}
